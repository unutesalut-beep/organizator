<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Organizator</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Organizator">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f4f4f7; --card:#fff; --text:#16161d; --muted:#6b6b78; --line:#e6e6ec;
  --accent:#4f46e5; --accent-soft:#eceafe; --red:#dc2626; --green:#16a34a; --orange:#ea8a0c;
  --tab-h:58px; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f0f13; --card:#1b1b22; --text:#f1f1f5; --muted:#9a9aa8; --line:#2b2b35;
         --accent:#8b84ff; --accent-soft:#25234a; --red:#f87171; --green:#4ade80; --orange:#fbbf24; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:28px;letter-spacing:-.5px}
.iconbtn{border:0;background:var(--accent-soft);color:var(--accent);width:38px;height:38px;border-radius:50%;
  font-size:20px;display:grid;place-items:center;cursor:pointer}
main{padding:0 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 90px)}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.pill.orange{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;
  background:none;color:#fff;font-size:15px;cursor:pointer;padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.done .t{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px;cursor:pointer}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:7px 4px;border-radius:8px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:12px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dn{font-size:12px;color:var(--muted);padding:4px 0}
.cal button{border:0;background:none;color:var(--text);aspect-ratio:1;border-radius:50%;font-size:15px;position:relative;cursor:pointer;padding:0}
.cal button.other{color:var(--muted);opacity:.45}
.cal button.today{color:var(--accent);font-weight:700}
.cal button.sel{background:var(--accent);color:#fff}
.cal button.has::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cal button.sel.has::after{background:#fff}
/* notes */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--card);border-radius:var(--radius);padding:12px;cursor:pointer;min-height:90px}
.note .t{font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.note .b{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.note .c{margin-top:8px}
.search{width:100%;border:0;background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px;margin-bottom:12px}
.searchrow{display:flex;gap:10px;align-items:flex-start}
.searchrow .search{flex:1}
.micbtn{flex:none;border:0;height:42px;padding:0 14px;border-radius:10px;background:var(--red);color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer}
.micbtn svg{width:18px;height:18px}
.rec{text-align:center;padding:10px 0 4px}
.rec .time{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;margin:6px 0 18px}
.rec .big{width:84px;height:84px;border-radius:50%;border:5px solid var(--line);background:var(--red);color:#fff;cursor:pointer;
  display:grid;place-items:center;margin:0 auto}
.rec .big i{display:block;width:30px;height:30px;border-radius:50%;background:#fff}
.rec .big.on i{border-radius:6px;width:28px;height:28px}
.rec .big.on{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.live{min-height:48px;margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--muted);font-size:15px;text-align:left;white-space:pre-wrap}
audio{width:100%;margin-top:10px}
/* money */
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.amt-out{color:var(--red);font-weight:600;white-space:nowrap}
.amt-in{color:var(--green);font-weight:600;white-space:nowrap}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--tab-h);border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);z-index:9;width:56px;height:56px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(79,70,229,.4);cursor:pointer}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head b{font-size:17px}
.link{border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:6px}
.link.strong{font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;border:0;background:var(--card);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:180px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;
  background:var(--card);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="title">Azi</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="Setări">⚙︎</button>
</header>

<main>
  <!-- AZI -->
  <section class="view active" id="v-today">
    <div class="stats">
      <div class="stat"><div class="n" id="st-tasks">0</div><div class="l">sarcini de făcut</div></div>
      <div class="stat"><div class="n" id="st-spent">0 lei</div><div class="l">cheltuit luna asta</div></div>
    </div>
    <div class="card"><h2 id="today-date"></h2><div id="today-events"></div></div>
    <div class="card"><h2>Sarcini pentru azi și restante</h2><div id="today-tasks"></div></div>
    <div class="card"><h2>Următoarele programări</h2><div id="upcoming"></div></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="v-cal">
    <div class="card">
      <div class="cal-head">
        <button class="iconbtn" id="calPrev" aria-label="Luna trecută">‹</button>
        <b id="calTitle"></b>
        <button class="iconbtn" id="calNext" aria-label="Luna viitoare">›</button>
      </div>
      <div class="cal" id="calGrid"></div>
    </div>
    <div class="card"><h2 id="calDayTitle"></h2><div id="calDayList"></div></div>
  </section>

  <!-- SARCINI -->
  <section class="view" id="v-tasks">
    <div class="seg" id="taskFilter">
      <button data-f="open" class="on">De făcut</button>
      <button data-f="done">Făcute</button>
      <button data-f="all">Toate</button>
    </div>
    <div class="card"><div id="taskList"></div></div>
  </section>

  <!-- NOTIȚE -->
  <section class="view" id="v-notes">
    <div class="searchrow">
      <input class="search" id="noteSearch" type="search" placeholder="Caută în notițe…">
      <button class="micbtn" id="voiceBtn" aria-label="Notă vocală"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Vocal</button>
    </div>
    <div class="notes" id="noteList"></div>
  </section>

  <!-- BANI -->
  <section class="view" id="v-money">
    <div class="cal-head card" style="margin-bottom:12px">
      <button class="iconbtn" id="monPrev" aria-label="Luna trecută">‹</button>
      <b id="monTitle"></b>
      <button class="iconbtn" id="monNext" aria-label="Luna viitoare">›</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n amt-out" id="mon-out">0</div><div class="l">cheltuieli</div></div>
      <div class="stat"><div class="n amt-in" id="mon-in">0</div><div class="l">venituri</div></div>
    </div>
    <div class="card"><h2>Pe categorii</h2><div id="monCats"></div></div>
    <div class="card"><h2>Tranzacții</h2><div id="monList"></div></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Adaugă">+</button>

<nav id="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Azi</button>
  <button data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</button>
  <button data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Sarcini</button>
  <button data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Notițe</button>
  <button data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v.01M18 15v.01"/></svg>Bani</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- date & stocare ---------- */
const KEY = 'organizator-data-v1';
const EMPTY = { events: [], tasks: [], notes: [], money: [] };
let db;
try { db = Object.assign(structuredClone(EMPTY), JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch { db = structuredClone(EMPTY); }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('Nu am putut salva!'); }
}
// cere browserului să nu șteargă datele
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const DAYS = ['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
const fmtDay = s => { const d = parse(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const lei = n => (Math.round(n * 100) / 100).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' lei';

const CATS_OUT = ['Mâncare','Casă','Facturi','Transport','Mașină','Sănătate','Haine','Distracție','Cadouri','Altele'];
const CATS_IN = ['Salariu','Bonus','Vânzări','Altele'];
const NOTE_CATS = ['Personal','Muncă','Idei','Cumpărături','Altele'];
const PRIO = { 1: ['Urgent', 'red'], 2: ['Normal', ''], 3: ['Când am timp', 'orange'] };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- navigare ---------- */
const TITLES = { today: 'Azi', cal: 'Calendar', tasks: 'Sarcini', notes: 'Notițe', money: 'Bani' };
let view = 'today';
function go(v) {
  view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('active', e.id === 'v-' + v));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#title').textContent = TITLES[v];
  try { localStorage.setItem('organizator-tab', v); } catch {}
  render(); window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });

/* ---------- sheet (formulare) ---------- */
function openSheet(html, onReady) {
  $('#sheet').innerHTML = html;
  $('#overlay').classList.add('open');
  onReady && onReady($('#sheet'));
}
function closeSheet() { $('#overlay').classList.remove('open'); $('#sheet').innerHTML = ''; }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
const head = (title, saveLabel = 'Salvează') =>
  `<div class="sheet-head"><button class="link" data-close>Anulează</button><b>${title}</b>${saveLabel ? `<button class="link strong" data-save>${saveLabel}</button>` : '<span style="width:70px"></span>'}</div>`;
const opts = (arr, sel) => arr.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');
function bind(sheet, onSave) {
  sheet.querySelector('[data-close]').onclick = closeSheet;
  const s = sheet.querySelector('[data-save]'); if (s) s.onclick = onSave;
}

/* ---------- PROGRAMĂRI ---------- */
function eventForm(ev = {}, date) {
  const isNew = !ev.id;
  openSheet(`${head(isNew ? 'Programare nouă' : 'Editează programarea')}
    <label>Titlu</label><input id="f-title" value="${esc(ev.title)}" placeholder="ex. Dentist">
    <div class="two">
      <div><label>Data</label><input id="f-date" type="date" value="${esc(ev.date || date || todayISO())}"></div>
      <div><label>Ora</label><input id="f-time" type="time" value="${esc(ev.time || '')}"></div>
    </div>
    <label>Locație</label><input id="f-loc" value="${esc(ev.loc)}" placeholder="opțional">
    <label>Detalii</label><input id="f-note" value="${esc(ev.note)}" placeholder="opțional">
    ${isNew ? '' : `<button class="btn" id="f-ics">🔔 Adaugă în Calendarul iPhone (cu alarmă)</button>
      <button class="btn danger" id="f-del">Șterge programarea</button>`}`,
  sh => {
    bind(sh, () => {
      const title = $('#f-title').value.trim(), d = $('#f-date').value;
      if (!title || !d) return toast('Completează titlul și data');
      const data = { title, date: d, time: $('#f-time').value, loc: $('#f-loc').value.trim(), note: $('#f-note').value.trim() };
      if (isNew) db.events.push({ id: uid(), ...data }); else Object.assign(ev, data);
      save(); closeSheet(); calSel = d; render(); toast('Salvat');
    });
    if (!isNew) {
      $('#f-ics').onclick = () => exportICS(ev);
      $('#f-del').onclick = () => { if (confirm('Ștergi programarea?')) { db.events = db.events.filter(x => x !== ev); save(); closeSheet(); render(); } };
    }
    if (isNew) setTimeout(() => $('#f-title').focus(), 250);
  });
}
function exportICS(ev) {
  const dt = ev.date.replace(/-/g, '');
  const e = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  let start, end;
  if (ev.time) {
    const [h, m] = ev.time.split(':').map(Number);
    const s = parse(ev.date); s.setHours(h, m);
    const f = new Date(s.getTime() + 60 * 60 * 1000); // durată 1 oră
    const local = d => `${iso(d).replace(/-/g, '')}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    start = `DTSTART:${local(s)}`; end = `DTEND:${local(f)}`;
  } else {
    const n = parse(ev.date); n.setDate(n.getDate() + 1);
    start = `DTSTART;VALUE=DATE:${dt}`; end = `DTEND;VALUE=DATE:${iso(n).replace(/-/g, '')}`;
  }
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Organizator//RO','BEGIN:VEVENT',
    `UID:${ev.id}@organizator`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    start, end, `SUMMARY:${e(ev.title)}`, ev.loc ? `LOCATION:${e(ev.loc)}` : '', ev.note ? `DESCRIPTION:${e(ev.note)}` : '',
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${e(ev.title)}`, ev.time ? 'TRIGGER:-PT30M' : 'TRIGGER:PT9H','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const url = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  const a = document.createElement('a'); a.href = url; a.download = 'programare.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
function eventRow(ev, showDate) {
  const when = [showDate ? fmtShort(ev.date) : '', ev.time].filter(Boolean).join(' · ') || 'toată ziua';
  return `<div class="row" data-ev="${ev.id}" style="cursor:pointer"><div class="grow"><div class="t">${esc(ev.title)}</div>
    <div class="s">${esc([ev.loc, ev.note].filter(Boolean).join(' — '))}</div></div><span class="pill">${esc(when)}</span></div>`;
}

/* ---------- AUDIO (stocat în IndexedDB, nu încape în localStorage) ---------- */
const audioDB = new Promise((res, rej) => {
  try {
    const r = indexedDB.open('organizator-audio', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('clips');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
});
async function audioOp(mode, fn) {
  const d = await audioDB;
  return new Promise((res, rej) => {
    const tx = d.transaction('clips', mode); const req = fn(tx.objectStore('clips'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const audioPut = (id, blob) => audioOp('readwrite', s => s.put(blob, id));
const audioGet = id => audioOp('readonly', s => s.get(id));
const audioDel = id => audioOp('readwrite', s => s.delete(id)).catch(() => {});
const audioClear = () => audioOp('readwrite', s => s.clear()).catch(() => {});
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const dataURLToBlob = u => fetch(u).then(r => r.blob());
const fmtDur = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;

/* ---------- înregistrare vocală ---------- */
function voiceRecorder() {
  if (!navigator.mediaDevices || !window.MediaRecorder)
    return toast('Telefonul nu permite înregistrarea aici. Actualizează iOS.');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec, stream, chunks = [], t0, timer, recog, transcript = '', interim = '', stopped = false, cancelled = false;
  openSheet(`${head('Notă vocală', '')}
    <div class="rec">
      <div class="time" id="r-time">0:00</div>
      <button class="big" id="r-btn" aria-label="Înregistrează"><i></i></button>
      <div class="hint" id="r-hint">Apasă butonul roșu ca să începi.</div>
      ${SR ? '<div class="live" id="r-live">Textul vorbit apare aici…</div>' : ''}
    </div>`, sh => {
    sh.querySelector('[data-close]').onclick = () => { cancelled = true; cleanup(); closeSheet(); };
    $('#r-btn').onclick = () => rec && rec.state === 'recording' ? stop() : start();
  });
  function cleanup() {
    stopped = true; clearInterval(timer);
    try { recog && recog.stop(); } catch {}
    try { rec && rec.state !== 'inactive' && rec.stop(); } catch {}
    stream && stream.getTracks().forEach(t => t.stop());
  }
  async function start() {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return toast('Permite accesul la microfon din Setări'); }
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = saveClip;
    rec.start(1000); t0 = Date.now();
    $('#r-btn').classList.add('on'); $('#r-hint').textContent = 'Înregistrez… apasă din nou ca să oprești și să salvezi.';
    timer = setInterval(() => { const el = $('#r-time'); if (el) el.textContent = fmtDur((Date.now() - t0) / 1000); }, 250);
    if (SR) {
      try {
        recog = new SR(); recog.lang = 'ro-RO'; recog.continuous = true; recog.interimResults = true;
        recog.onresult = e => {
          interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) transcript += r[0].transcript.trim() + ' '; else interim += r[0].transcript;
          }
          const el = $('#r-live'); if (el) el.textContent = (transcript + interim).trim() || '…';
        };
        recog.onend = () => { if (!stopped && rec && rec.state === 'recording') try { recog.start(); } catch {} };
        recog.onerror = () => {};
        recog.start();
      } catch { recog = null; }
    }
  }
  function stop() { $('#r-hint').textContent = 'Salvez…'; const dur = (Date.now() - t0) / 1000; stop.dur = dur; cleanup(); }
  async function saveClip() {
    if (cancelled) return;
    const type = (chunks[0] && chunks[0].type) || rec.mimeType || 'audio/mp4';
    const blob = new Blob(chunks, { type }); if (!blob.size) { closeSheet(); return toast('Înregistrarea e goală'); }
    const id = uid(); const now = new Date();
    try { await audioPut(id, blob); } catch { closeSheet(); return toast('Nu am putut salva sunetul'); }
    const text = (transcript + interim).trim();
    db.notes.push({ id: uid(), title: text ? text.slice(0, 40) : `Notă vocală ${now.getDate()} ${MONTHS[now.getMonth()].slice(0, 3)}, ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      body: text, cat: 'Personal', updated: Date.now(), audio: id, dur: Math.round(stop.dur || 0) });
    save(); closeSheet(); if (view !== 'notes') go('notes'); else render(); toast('Notă vocală salvată 🎤');
  }
}

        if (!Array.isArray(d.events) || !Array.isArray(d.tasks)) throw 0;
        if (!confirm('Înlocuiești datele actuale cu cele din backup?')) return;
        db = Object.assign(structuredClone(EMPTY), d); save();
        for (const [id, url] of Object.entries(obj.audio || {})) { try { await audioPut(id, await dataURLToBlob(url)); } catch {} }
        closeSheet(); render(); toast('Restaurat');
      } catch { toast('Fișier de backup invalid'); }
    };
    $('#s-clean').onclick = () => { const n = db.tasks.filter(t => t.done).length; db.tasks = db.tasks.filter(t => !t.done); save(); render(); toast(`Șterse ${n} sarcini`); closeSheet(); };
    $('#s-wipe').onclick = () => {
      if (confirm('Sigur ștergi TOATE datele? Nu se poate anula.') && confirm('Ultima confirmare: ștergi tot?')) { db = structuredClone(EMPTY); save(); audioClear(); closeSheet(); render(); }
    };
  });
};

/* ---------- pornire ---------- */
function render() {
  if (view === 'today') renderToday();
  if (view === 'cal') renderCal();
  if (view === 'tasks') renderTasks();
  if (view === 'notes') renderNotes();
  if (view === 'money') renderMoney();
}
// re-randează la revenirea în aplicație (ex. a doua zi)
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
let startTab; try { startTab = localStorage.getItem('organizator-tab'); } catch {}
go(TITLES[startTab] ? startTab : 'today');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
